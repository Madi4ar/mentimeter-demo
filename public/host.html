<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STEM AI Innovation — ведущий</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="tailwind.css">
</head>
<body>

<div id="login" class="grid h-full place-items-center p-5" hidden>
  <form id="login-form" class="grid w-[min(420px,100%)] gap-3.5 rounded-[20px] border-2 border-ink bg-white p-7 shadow-[6px_6px_0_var(--color-ink)]">
    <h1 class="font-display text-2xl leading-[1.12] font-bold">STEM AI Innovation</h1>
    <p class="m-0 text-muted" data-i18n="login.pin"></p>
    <input id="pin" class="rounded-xl border-2 border-line bg-white px-[0.9em] py-[0.7em] text-ink placeholder:text-[#8c9ab3] focus:border-blue focus:outline-none" type="password" autocomplete="current-password" placeholder="PIN" required>
    <div class="min-h-[1.3em] font-extrabold text-bad" id="login-err"></div>
    <button data-btn="primary" type="submit" data-i18n="login.btn"></button>
    <div id="login-lang" class="mt-3.5 text-ink"></div>
  </form>
</div>

<div id="app" class="relative z-[1] grid h-full grid-rows-[minmax(0,1fr)_auto]" hidden>
  <main id="stage" class="min-h-0 animate-fade overflow-hidden p-[clamp(16px,2.6vw,44px)] max-[820px]:overflow-y-auto"></main>
  <footer id="bar" class="flex flex-wrap items-center justify-between gap-3 bg-ink px-[clamp(16px,2.6vw,44px)] py-2.5 text-white"><div id="bar-left" class="flex min-w-0 items-center gap-3 font-bold"></div><div id="bar-right" class="flex flex-wrap items-center justify-end gap-3"></div></footer>
</div>
<canvas id="net" class="pointer-events-none fixed inset-0 z-0 size-full opacity-0 transition-opacity duration-[800ms] data-[on]:opacity-100"></canvas>
<canvas id="confetti" class="pointer-events-none fixed inset-0 z-30 size-full"></canvas>

<script src="i18n.js"></script>
<script src="ui.js"></script>
<script src="qrcode.js"></script>
<script>
(function () {
'use strict';

const $ = (s, r) => (r || document).querySelector(s);
const t = I18N.t;
const U = window.UI;
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
const DOT = 'size-2.5 shrink-0 rounded-full ';
const STAGE = 'min-h-0 animate-fade p-[clamp(16px,2.6vw,44px)] ';
const OPT = 'group/opt relative flex animate-rise items-center gap-[0.7em] overflow-hidden rounded-[18px] border-[3px] border-ink bg-white px-[clamp(14px,1.8vw,28px)] py-[clamp(12px,2vh,26px)] ' +
  'min-h-[calc(clamp(64px,12.5vh,140px)*var(--fs))] text-[length:calc(clamp(17px,2.2vw,34px)*var(--fs))] font-extrabold text-ink shadow-[0_6px_0_var(--color-ink)] ' +
  'transition-[opacity,translate,background-color,border-color,box-shadow] duration-[400ms] last:odd:col-span-full ' +
  'data-[r=wrong]:opacity-40 data-[r=correct]:-translate-y-0.5 data-[r=correct]:border-good data-[r=correct]:bg-good-bg data-[r=correct]:shadow-[0_6px_0_var(--color-good)]';
const PBLOCK = { 1: 'bg-orange [--h:32vh]', 2: 'bg-blue [--h:24vh]', 3: 'bg-teal [--h:17vh]' };
const LET = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
const MAXOPT = 8;
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

let PIN = '';
try { PIN = sessionStorage.getItem('pin') || ''; } catch (e) { /* нет хранилища */ }

let S = null;          // последнее состояние с сервера
let offset = 0;        // сдвиг часов сервера
let quiz = null;       // вопросы (редактор)
let info = { urls: [], publicUrl: null };
let forceEditor = false;
let editorError = '';
let saveStatus = '';
let connected = false;
let cur = null;
let primaryFn = null;
let urlIdx = 0;
let pendingConfirm = null;
const views = {};
const stage = $('#stage');
const timeouts = [];
let raf = 0;

function later(fn, ms) { const t = setTimeout(fn, ms); timeouts.push(t); return t; }
function clearLater() { while (timeouts.length) clearTimeout(timeouts.pop()); cancelAnimationFrame(raf); }
function plural(n, a, b, c) {
  const m = n % 100, k = n % 10;
  if (m > 10 && m < 20) return c;
  if (k === 1) return a;
  if (k >= 2 && k <= 4) return b;
  return c;
}
function toast(msg) {
  const t = h('div', 'fixed bottom-[84px] left-1/2 z-40 max-w-[92vw] -translate-x-1/2 animate-rise rounded-xl bg-ink px-[1.2em] py-[0.7em] font-extrabold text-white shadow-[0_10px_30px_rgba(0,0,0,0.3)]', msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 3500);
}

/* ---------- сеть ---------- */

function errMsg(j) { return j && j.code && I18N.has('err.' + j.code) ? t('err.' + j.code, { n: j.n }) : (j && j.error) || ''; }

async function api(path, body) {
  const r = await fetch(path, {
    method: body === undefined ? 'GET' : 'POST',
    headers: { 'content-type': 'application/json', 'x-pin': PIN },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let j = {};
  try { j = await r.json(); } catch (e) { /* пусто */ }
  if (r.status === 401) { logout(); throw new Error(errMsg(j) || t('err.bad_pin')); }
  if (!r.ok) throw new Error(errMsg(j) || ('HTTP ' + r.status));
  return j;
}

async function doAction(type, extra) {
  try {
    await api('/api/host/action', Object.assign({ type }, extra || {}));
  } catch (e) {
    toast(e.message);
    if (type === 'start') { forceEditor = true; editorError = e.message; render(); }
  }
}

function logout() {
  try { sessionStorage.removeItem('pin'); } catch (e) { /* ignore */ }
  location.reload();
}

/* ---------- вход ---------- */

function showLogin() {
  $('#login').hidden = false;
  $('#app').hidden = true;
  $('#pin').focus();
}
$('#login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  PIN = $('#pin').value;
  $('#login-err').textContent = '';
  try {
    quiz = await api('/api/host/quiz');
    try { sessionStorage.setItem('pin', PIN); } catch (er) { /* ignore */ }
    startApp();
  } catch (er) {
    $('#login-err').textContent = t('login.bad');
  }
});

async function boot() {
  // автовход: адрес вида /host#pin=1234 (его открывает start.bat), PIN сразу убирается из адресной строки
  const hm = /[#&]pin=([^&]+)/.exec(location.hash);
  if (hm) {
    PIN = decodeURIComponent(hm[1]);
    try { sessionStorage.setItem('pin', PIN); } catch (e) { /* ignore */ }
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ignore */ }
  }
  document.title = t('host.title');
  I18N.apply();
  document.querySelectorAll('[data-btn]').forEach((b) => { b.className = U.btn(b.dataset.btn); });
  const paintLoginLang = () => $('#login-lang').replaceChildren(I18N.switcher(() => { document.title = t('host.title'); I18N.apply(); paintLoginLang(); }));
  paintLoginLang();
  try { info = await (await fetch('/api/info')).json(); } catch (e) { /* ignore */ }
  if (PIN) {
    try { quiz = await api('/api/host/quiz'); startApp(); return; } catch (e) { /* покажем вход */ }
  }
  showLogin();
}

function startApp() {
  $('#login').hidden = true;
  $('#app').hidden = false;
  subscribe();
  requestAnimationFrame(tick);
}

// Основной канал: поток событий (SSE). Если он не работает (туннель или прокси его не пропускает),
// через несколько секунд переходим на опрос раз в секунду.
function onState(st) {
  if (st.hb) return;
  S = st;
  offset = S.now - Date.now();
  connected = true;
  render();
}

function subscribe() {
  let es = null;
  let polling = false;
  let lastMsg = 0;
  function startPoll() {
    if (polling) return;
    polling = true;
    if (es) es.close();
    (async function loop() {
      let d = 800;
      try {
        const r = await fetch('/api/state?role=host', { cache: 'no-store', headers: { 'x-pin': PIN } });
        if (r.ok) { const j = await r.json(); if (j.poll) d = j.poll; connected = true; onState(j); } else { connected = false; paintDot(); }
      } catch (e) { connected = false; paintDot(); }
      setTimeout(loop, d);
    })();
  }
  if (!window.EventSource || (info && info.mode === 'poll') || /[?&]poll=1/.test(location.search)) { startPoll(); return; }
  es = new EventSource('/events?role=host&pin=' + encodeURIComponent(PIN));
  es.onopen = () => { connected = true; paintDot(); };
  es.onmessage = (ev) => { lastMsg = Date.now(); onState(JSON.parse(ev.data)); };
  es.onerror = () => { connected = false; paintDot(); };
  setTimeout(() => { if (!lastMsg) startPoll(); }, 5000);
  setInterval(() => { if (lastMsg && Date.now() - lastMsg > 25000) startPoll(); }, 5000);
}

function paintDot() { const d = $('#bar-dot'); if (d) d.className = DOT + (connected ? 'bg-[#35d68f]' : 'bg-bad'); }

/* ---------- переключение экранов ---------- */

function viewFor() {
  if (S.phase === 'lobby') return (forceEditor || !quiz || !quiz.questions.length) ? 'editor' : 'lobby';
  if (S.phase === 'question' || S.phase === 'reveal') return 'q';
  return S.phase;
}

function render() {
  if (!S) return;
  const name = viewFor();
  if (name !== cur) {
    if (cur && views[cur].leave) views[cur].leave();
    clearLater();
    cur = name;
    stage.className = STAGE + (name === 'editor' ? 'overflow-y-auto' : 'overflow-hidden max-[820px]:overflow-y-auto');
    stage.replaceChildren();
    views[name].enter();
  }
  views[name].update();
  renderBar();
}

/* ---------- язык ---------- */

function relang() {
  document.title = t('host.title');
  I18N.apply();
  editorError = ''; saveStatus = ''; pendingConfirm = null;
  if (!S) return;
  if (cur && views[cur].leave) views[cur].leave();
  clearLater();
  cur = null;
  render();
}

/* ---------- нижняя панель ---------- */

function barCls(cls) {
  cls = cls || '';
  const kind = cls.includes('primary') ? 'barPrimary' : cls.includes('danger') ? 'barDanger' : 'bar';
  return U.btn(kind, cls.includes('sm') ? 'sm' : 'md');
}

function renderBar() {
  const L = $('#bar-left');
  const R = $('#bar-right');
  L.replaceChildren();
  R.replaceChildren();
  const brand = h('span', U.brand);
  brand.innerHTML = '<svg class="size-6 shrink-0" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M5 18 12 5l7 13M5 18h14"/></g><circle cx="12" cy="5" r="2.6" fill="#f04e0f"/><circle cx="5" cy="18" r="2.6" fill="#7c93ff"/><circle cx="19" cy="18" r="2.6" fill="#35d6c2"/></svg>';
  brand.append('STEM · AI · Innovation');
  L.append(brand, h('span', 'h-5 w-px shrink-0 bg-white/30'));
  const dot = h('span', DOT + (connected ? 'bg-[#35d68f]' : 'bg-bad'));
  dot.id = 'bar-dot';
  dot.title = t('bar.link');
  L.append(dot);
  const note = h('span');
  L.append(note);
  primaryFn = null;

  function btn(label, fn, cls, key) {
    const b = h('button', barCls(cls), label);
    if (key) b.append(h('kbd', 'ml-[0.5em] rounded-md bg-white/30 px-[0.45em] py-[0.05em] font-mono text-[0.78em] font-bold', key));
    b.type = 'button';
    b.onclick = fn;
    R.append(b);
    return b;
  }
  function confirmBtn(id, label, fn, cls) {
    const b = h('button', barCls(cls), pendingConfirm === id ? t('bar.confirm') : label);
    b.type = 'button';
    b.onclick = () => {
      if (pendingConfirm === id) { pendingConfirm = null; fn(); } else {
        pendingConfirm = id;
        b.textContent = t('bar.confirm');
        setTimeout(() => { if (pendingConfirm === id) { pendingConfirm = null; b.textContent = label; } }, 3000);
      }
    };
    R.append(b);
  }
  const last = S.qIndex + 1 >= S.total;

  if (cur === 'editor') {
    const st = h('span', null, saveStatus);
    st.id = 'save-status';
    note.replaceWith(st);
    btn(t('bar.paste'), openImport, 'sm');
    btn(t('bar.tolobby'), goLobby, 'primary');
    primaryFn = null;
  } else if (cur === 'lobby') {
    note.textContent = t('bar.lobbyNote', { n: S.total, w: t('questions', { n: S.total }) });
    btn(t('bar.editor'), () => { forceEditor = true; editorError = ''; render(); }, 'sm');
    if (S.playerCount > 0) confirmBtn('clear', t('bar.clear'), () => doAction('clear'), 'sm danger');
    const go = () => doAction('start');
    btn(t('bar.start'), go, 'primary', t('space'));
    primaryFn = go;
  } else if (cur === 'q' && S.phase === 'question') {
    note.textContent = t('bar.qnote', { x: S.qIndex + 1, n: S.total });
    const f = () => doAction('reveal');
    btn(t('bar.reveal'), f, 'primary', t('space'));
    primaryFn = f;
  } else if (cur === 'q') {
    note.textContent = t('bar.revealed', { x: S.qIndex + 1, n: S.total });
    btn(t('bar.board'), () => doAction('board'), '');
    const f = () => doAction(last ? 'final' : 'next');
    btn(last ? t('bar.final') : t('bar.next'), f, 'primary', t('space'));
    primaryFn = f;
  } else if (cur === 'board') {
    note.textContent = t('bar.boardNote', { x: S.qIndex + 1, n: S.total });
    const f = () => doAction(last ? 'final' : 'next');
    btn(last ? t('bar.final') : t('bar.next'), f, 'primary', t('space'));
    primaryFn = f;
  } else if (cur === 'final') {
    note.textContent = t('bar.over');
    confirmBtn('clear', t('bar.newroom'), () => doAction('clear'), 'sm danger');
    const f = () => doAction('reset');
    btn(t('bar.again'), f, 'primary');
  }
  const fs = h('button', U.btn('bar', 'sm'), '⛶');
  fs.type = 'button';
  fs.title = t('bar.fs');
  fs.setAttribute('aria-label', t('bar.fs'));
  fs.onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  };
  R.append(I18N.switcher(relang, true), fs);
}

addEventListener('keydown', (e) => {
  const tag = document.activeElement && document.activeElement.tagName;
  if (/INPUT|TEXTAREA|SELECT|BUTTON/.test(tag)) return;
  if ((e.code === 'Space' || e.key === 'Enter' || e.key === 'ArrowRight') && primaryFn) {
    e.preventDefault();
    primaryFn();
  }
});

/* ---------- зал ожидания ---------- */

function joinUrls() {
  if (info.publicUrl) return [info.publicUrl];
  const local = ['localhost', '127.0.0.1', '[::1]', '::1'].indexOf(location.hostname) >= 0;
  if (!local) return [location.origin];
  return info.urls && info.urls.length ? info.urls : [location.origin];
}

function paintQr() {
  const list = joinUrls();
  const url = list[urlIdx % list.length];
  $('#lb-url').textContent = url.replace(/^https?:\/\//, '');
  try {
    const qr = qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    $('#lb-qr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  } catch (e) { $('#lb-qr').textContent = ''; }
  $('#lb-switch').hidden = list.length < 2;
  const hostOf = url.replace(/^https?:\/\//, '').replace(/[:/].*$/, '');
  $('#lb-warn').hidden = !(/^(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|169\.254\.)/.test(hostOf) || (hostOf.indexOf('.') < 0));
}

/* фон зала ожидания: медленно дрейфующая нейросеть из узлов и связей */
let netRaf = 0;
function startNet() {
  const cv = $('#net');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0;
  const fit = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
  fit();
  addEventListener('resize', fit);
  const N = Math.round(Math.min(70, Math.max(30, (innerWidth * innerHeight) / 26000)));
  const nodes = Array.from({ length: N }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    vx: (Math.random() - 0.5) * 0.35, vy: (Math.random() - 0.5) * 0.35,
    r: 2 + Math.random() * 3, hot: Math.random() < 0.12,
  }));
  $('#net').toggleAttribute('data-on', true);
  function frame() {
    ctx.clearRect(0, 0, W, H);
    for (const n of nodes) {
      if (!REDUCED) { n.x += n.vx; n.y += n.vy; }
      if (n.x < 0 || n.x > W) n.vx *= -1;
      if (n.y < 0 || n.y > H) n.vy *= -1;
    }
    const L = 190;
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < L) {
          ctx.strokeStyle = 'rgba(36,71,255,' + (0.22 * (1 - d / L)).toFixed(3) + ')';
          ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
    }
    for (const n of nodes) {
      ctx.fillStyle = n.hot ? 'rgba(240,78,15,0.55)' : 'rgba(36,71,255,0.35)';
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 6.2832); ctx.fill();
    }
    if (!REDUCED) netRaf = requestAnimationFrame(frame);
  }
  frame();
  views.lobby._fit = fit;
}
function stopNet() {
  cancelAnimationFrame(netRaf);
  $('#net').toggleAttribute('data-on', false);
  if (views.lobby._fit) removeEventListener('resize', views.lobby._fit);
}

let chips = new Map();
views.lobby = {
  enter() {
    stage.innerHTML = `
      <section class="relative grid h-full grid-cols-[minmax(300px,0.95fr)_1.05fr] items-center gap-[4vw] max-[820px]:h-auto max-[820px]:grid-cols-1">
        <div class="grid justify-items-start gap-[clamp(12px,2vh,24px)]">
          <p class="m-0 font-mono text-[clamp(12px,1.3vw,18px)] font-bold tracking-[0.16em] text-orange uppercase">${t('lobby.eyebrow')}</p>
          <h1 class="font-display text-[clamp(34px,5vw,80px)] leading-[1.02] font-bold">STEM <span class="text-blue">AI</span> Innovation</h1>
          <p class="m-0 text-[clamp(15px,1.7vw,24px)] font-bold text-muted">${t('lobby.lead')}</p>
          <div class="aspect-square w-[min(clamp(190px,23vw,360px),38vh)] rounded-[20px] border-2 border-ink bg-white p-[clamp(10px,1.2vw,18px)] shadow-[6px_6px_0_var(--color-ink)] [&_svg]:block [&_svg]:size-full" id="lb-qr"></div>
          <button class="cursor-pointer rounded-xl border-2 border-ink bg-white px-[0.8em] py-[0.5em] text-left font-mono text-[clamp(14px,1.6vw,24px)] font-bold break-all text-ink shadow-[0_3px_0_var(--color-ink)]" id="lb-url" type="button" title="${t('lobby.urltitle')}"></button>
          <p class="m-0 max-w-[30em] rounded-xl border-2 border-orange bg-[#fff3e8] px-[0.9em] py-[0.6em] text-[clamp(13px,1.1vw,17px)] leading-[1.35] font-bold text-[#7a2a00]" id="lb-warn" hidden>${t('lobby.warn')}</p>
          <p class="m-0 text-[clamp(15px,1.7vw,24px)] font-bold text-muted" id="lb-switch" hidden>${t('lobby.switch')}</p>
        </div>
        <div class="grid min-w-0 content-center gap-4">
          <div class="flex items-baseline gap-[0.5em]"><b class="font-display text-[clamp(56px,9vw,140px)] leading-none font-bold text-orange tabular-nums" id="lb-count">0</b><span class="text-[clamp(16px,2vw,30px)] font-extrabold" id="lb-word"></span></div>
          <div class="flex max-h-[54vh] flex-wrap content-start gap-2.5 overflow-hidden" id="lb-chips"></div>
          <p class="m-0 text-[clamp(15px,1.7vw,22px)] font-bold text-muted" id="lb-empty">${t('lobby.empty')}</p>
        </div>
      </section>`;
    chips = new Map();
    urlIdx = 0;
    $('#lb-url').onclick = () => { urlIdx++; paintQr(); };
    paintQr();
    startNet();
  },
  leave() { stopNet(); },
  update() {
    const list = S.players || [];
    $('#lb-count').textContent = S.playerCount;
    $('#lb-word').textContent = t('participants', { n: S.playerCount });
    $('#lb-empty').hidden = S.playerCount > 0;
    const wrap = $('#lb-chips');
    const ids = new Set(list.map((p) => p.id));
    for (const [id, el] of chips) if (!ids.has(id)) { el.remove(); chips.delete(id); }
    for (const p of list) {
      if (chips.has(p.id)) continue;
      const c = h('span', 'group inline-flex max-w-full animate-pop items-center gap-[0.4em] rounded-full border-2 border-ink bg-white py-[0.35em] pr-[0.5em] pl-4 text-[clamp(14px,1.6vw,24px)] font-extrabold');
      c.append(h('span', 'truncate', p.name));
      const x = h('button', 'size-[1.4em] cursor-pointer rounded-full bg-transparent leading-none font-extrabold text-ink opacity-0 group-hover:bg-ink/10 group-hover:opacity-100 focus-visible:bg-ink/10 focus-visible:opacity-100', '×');
      x.type = 'button';
      x.title = t('kick');
      x.setAttribute('aria-label', t('kick.named', { name: p.name }));
      x.onclick = () => doAction('kick', { id: p.id });
      c.append(x);
      wrap.append(c);
      chips.set(p.id, c);
    }
  },
};

/* ---------- редактор вопросов ---------- */

let saveT = 0;
function scheduleSave() {
  saveStatus = t('save.ing');
  const st = $('#save-status'); if (st) st.textContent = saveStatus;
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    try { await api('/api/host/quiz', quiz); saveStatus = t('save.ok'); } catch (e) { saveStatus = t('save.fail') + e.message; }
    const s2 = $('#save-status'); if (s2) s2.textContent = saveStatus;
  }, 600);
}

function goLobby() {
  const err = validateLocal();
  clearTimeout(saveT);
  api('/api/host/quiz', quiz).then(() => {

function validateLocal() {

}

function parseBulk(t) {
  const blocks = t.replace(/\r/g, '').split(/\n\s*\n/)
    .map((b) => b.split('\n').map((l) => l.trim()).filter(Boolean))
    .filter((b) => b.length >= 3);
  return blocks.map((lines) => {
    const text = lines[0].replace(/^\d+[.)]\s*/, '');
    const options = [];
    let correct = -1;
    lines.slice(1, MAXOPT + 1).forEach((l) => {
      let ok = false;
      if (/^[+*]/.test(l)) { ok = true; l = l.replace(/^[+*]\s*/, ''); }
      l = l.replace(/^[A-HА-Г][.)]\s+/i, '');
      if (ok && correct < 0) correct = options.length;
      options.push(l);
    });
    while (options.length < 2) options.push('');
    return { text, options, correct, seconds: 20 };
  });
}

    fs = Math.round((fs - 0.04) * 100) / 100;

  }
  root.toggleAttribute('data-measuring', false);
}

function countUp(el, from, to, dur) {
  if (from === to || REDUCED) { el.textContent = to; return; }
  const t0 = performance.now();
  (function f(t) {
    const k = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(from + (to - from) * e);
    if (k < 1) raf = requestAnimationFrame(f);
  })(t0);
}

function confetti() {
  if (REDUCED) return;
  const cv = $('#confetti');
  cv.width = innerWidth; cv.height = innerHeight;
  const ctx = cv.getContext('2d');
  const cols = ['#f04e0f', '#2447ff', '#008f80', '#d6307f', '#0a1733', '#ffb020'];
  const P = Array.from({ length: 200 }, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * 0.6,
    vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 4.5, s: 6 + Math.random() * 9,
    r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, c: cols[(Math.random() * cols.length) | 0],
  }));
  const t0 = performance.now();
  (function f(t) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    let alive = false;
    for (const p of P) {
      p.x += p.vx; p.y += p.vy; p.r += p.vr;
      if (p.y < cv.height + 20) alive = true;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.6);
      ctx.restore();
    }
    if (alive && t - t0 < 9000) requestAnimationFrame(f); else ctx.clearRect(0, 0, cv.width, cv.height);
  })(t0);
}

        h('div', 'mt-[0.2em] mb-[0.4em] font-mono text-[clamp(18px,2.4vw,36px)] font-bold text-orange tabular-nums opacity-0 transition-opacity delay-150 duration-[600ms] group-data-[shown]:opacity-100', r.score + ' ' + t('pts', { n: r.score })),
        h('div', 'grid h-0 w-full items-start justify-items-center overflow-hidden rounded-t-2xl border-[3px] border-b-0 border-ink pt-[0.1em] font-display text-[clamp(34px,6vw,96px)] font-black text-white transition-[height] duration-1000 ease-[cubic-bezier(0.2,0.9,0.2,1)] group-data-[on]:h-(--h) ' + PBLOCK[r.rank], String(r.rank)));
      pod.append(c);
      cols[r.rank] = c;
    });
    const step = (rank, at) => {
      const c = cols[rank];
      if (!c) return;
      later(() => { c.toggleAttribute('data-on', true); }, REDUCED ? 0 : at);
      later(() => { c.toggleAttribute('data-shown', true); }, REDUCED ? 0 : at + 800);
    };
    step(3, 400); step(2, 1700); step(1, 3000);
    if (cols[1]) later(confetti, REDUCED ? 0 : 3900);
    const rest = $('#fn-rest');
    rows.slice(3).forEach((r, i) => {
      const e = h('div', 'flex min-w-0 animate-rise items-center gap-[0.7em] rounded-xl border-2 border-ink bg-white px-[0.8em] py-[0.3em] text-[clamp(13px,1.5vw,22px)] font-extrabold');
      e.style.animationDelay = ((REDUCED ? 0 : 4.4) + i * 0.12) + 's';
      e.append(h('b', 'w-[1.8em] font-mono font-bold text-muted', String(r.rank)), h('span', 'min-w-0 flex-1 truncate', r.name), h('em', 'font-mono font-bold text-orange not-italic tabular-nums', String(r.score)));
      rest.append(e);
    });
  },
  leave() { clearLater(); const cv = $('#confetti'); cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); },
};

boot();
})();
</script>
</body>
